# Plan wydania zmiany CHG-4 — kontrakt pdi 0.12.0 (release-plan.schema.json); sprawdza: decision_record.py check.
# R1 = MVP: gwiazda przewodnia plus minimum do wyniku z intent.md. Każde TSK z plan.md w dokładnie jednej linii;
# kolumny „Wydanie" i „Flaga" w plan.md muszą się zgadzać z tym plikiem.
# Owner, remove_by i kryteria wyjścia to [propozycja] do potwierdzenia na bramce B3 (pytania w plan.md).
change: CHG-4
mvp:
  release: R1
  outcome: "Tester i członek zespołu od razu widzi po znaczniku w nagłówku i prefiksie karty, czy strona działa na test, czy na prod"
  metric:
    name: pomylki_srodowiska_w_zgloszeniach
    target: "= 0 w przeglądzie zgłoszeń z 4 tygodni po włączeniu (przegląd: właściciel aplikacji, CHG-4/D2)"
    horizon_days: 28
  guardrails:
    - "strona z flagą env_badge off bajt w bajt jak dotychczas"
    - "kontrast tekstu znacznika >= 4,5:1"
releases:
  - { id: R1, name: MVP, tasks: [TSK-1] }
flags:
  - key: env_badge
    tasks: [TSK-1]
    owner: "Właściciel aplikacji sdlc-proba"
    remove_by: 2027-03-31
    rollout:
      - { stage: internal, min_days: 3, exit: "znacznik TEST i prefiks [TEST] widoczne na test, zero błędów 5xx w logu serwera" }
      - { stage: "100%", min_days: 0, exit: "znacznik PROD widoczny na prod po decyzji właściciela; po 4 tygodniach przegląd zgłoszeń, potem PR usuwający flagę" }
targets:
  coverage: { kind: changed_lines, min_percent: 90, tool: "node --test --experimental-test-coverage" }
