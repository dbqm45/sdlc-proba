rules:
  - id: node-sqlite-sql-from-string
    message: >-
      SQL for node:sqlite is built from a string with a value in it. Use a `?` placeholder in a constant
      statement and pass the value to run/get/all, so input cannot change the query.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A03:2021 - Injection"
        - "A05:2025 - Injection"
      category: security
    # Not a value: string literals and UPPER_SNAKE_CASE code constants (e.g. LIST_SQL). Anything else in the
    # statement (a variable, a call, a property) is a value and makes the finding.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $DB.prepare(`...${$X}...`)
              - pattern: $DB.exec(`...${$X}...`)
          - metavariable-regex:
              metavariable: $X
              regex: '^(?![A-Z][A-Z0-9_]*$)'
      - patterns:
          - pattern-either:
              - pattern: $DB.prepare($ARG)
              - pattern: $DB.exec($ARG)
          - metavariable-pattern:
              metavariable: $ARG
              pattern: $A + $B
          - metavariable-regex:
              metavariable: $ARG
              regex: '^(?!\s*(?:''(?:[^''\\\n]|\\.)*''|"(?:[^"\\\n]|\\.)*"|[A-Z][A-Z0-9_]*)(?:\s*\+\s*(?:''(?:[^''\\\n]|\\.)*''|"(?:[^"\\\n]|\\.)*"|[A-Z][A-Z0-9_]*))*\s*$)'
